name: Atualizar os valores do site

# Todo dia baixa os valores do AJ Item Worth Wiki e, se algo mudou, sobe um items.js novo.
# O Vercel publica o site sozinho a cada push no main.
on:
  schedule:
    - cron: '0 9 * * *' # 6h da manhã no horário de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/atualizar-site.yml
      - scripts/atualizar-site.mjs

permissions:
  contents: write

concurrency: atualizar-site

jobs:
  valores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/atualizar-site.mjs
      - name: Subir o items.js novo
        run: |
          if git diff --quiet -- items.js; then exit 0; fi
          git config user.name "yurirubim1"
          git config user.email "266201721+yurirubim1@users.noreply.github.com"
          git add items.js
          git commit -m "Valores do wiki de $(date -u +%d/%m/%Y) (automático)"
          git pull --rebase origin main
          git push origin HEAD:main
